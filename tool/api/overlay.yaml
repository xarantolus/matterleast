overlay: 1.0.0
info:
  title: Matterleast fixes to the Mattermost v4 spec
  version: 1.0.0
actions:
  # --- validation errors in the upstream spec ---
  - target: "$.paths['/api/v4/channels/{channel_id}/bookmarks'].post.body"
    remove: true
  - target: "$.paths['/api/v4/channels/{channel_id}/bookmarks/{bookmark_id}'].patch.body"
    remove: true
  - target: "$.paths['/api/v4/channels/{channel_id}/bookmarks/{bookmark_id}/sort_order'].post.body"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/custom_profile_attributes'].get.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/custom_profile_attributes'].get.responses['200']"
    update:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: {type: string}
  - target: "$.components.schemas.ContentFlaggingConfig.properties.EnableContentFlagging"
    remove: true
  - target: "$.components.schemas.ContentFlaggingConfig.properties"
    update:
      EnableContentFlagging: {type: boolean}
      NotificationSettings: {$ref: "#/components/schemas/NotificationSettings"}
      AdditionalSettings: {$ref: "#/components/schemas/AdditionalSettings"}
      ReviewerSettings: {$ref: "#/components/schemas/ReviewerSettings"}
  - target: "$.components.schemas.PluginStatus.properties.state"
    update: {type: string}
  - target: "$.paths['/api/v4/drafts'].post.responses['201'].content['application/json'].schema"
    update: {type: object}
  - target: "$.paths['/api/v4/teams/{team_id}/access_control/policy'].get.responses['200'].content['application/json'].schema.properties.policy"
    update: {type: object}
  - target: "$.paths['/api/v4/users/{user_id}/reset_failed_attempts'].post"
    update:
      parameters: [{name: user_id, in: path, required: true, schema: {type: string}}]
  - target: "$.paths['/api/v4/remotecluster/{remote_id}/generate_invite'].post"
    update:
      parameters: [{name: remote_id, in: path, required: true, schema: {type: string}}]
  - target: "$.paths['/api/v4/posts/scheduled/team/{team_id}'].get.parameters"
    update: [{name: team_id, in: path, required: true, schema: {type: string}}]
  - target: "$.paths['/api/v4/files/search'].post"
    update: {operationId: SearchFilesAllTeams}
  # --- core models: fields the server sends but the spec omits (server/public/model/*.go) ---
  - target: "$.components.schemas.Post.properties.hashtag"
    remove: true
  - target: "$.components.schemas.Post.properties"
    update:
      hashtags: {type: string}
      is_pinned: {type: boolean}
      message_source: {type: string}
      has_reactions: {type: boolean}
      remote_id: {type: string}
      reply_count: {type: integer, format: int64}
      last_reply_at: {type: integer, format: int64}
      participants: {type: array, items: {$ref: "#/components/schemas/User"}}
      is_following: {type: boolean}
  - target: "$.components.schemas.PostMetadata.properties"
    update:
      expire_at: {type: integer, format: int64}
      recipients: {type: array, items: {type: string}}
      redacted_file_count: {type: integer}
  - target: "$.components.schemas.PostList.properties"
    update:
      first_inaccessible_post_time: {type: integer, format: int64}
  - target: "$.components.schemas.User.properties"
    update:
      is_bot: {type: boolean}
      bot_description: {type: string}
      bot_last_icon_update: {type: integer, format: int64}
      last_activity_at: {type: integer, format: int64}
      position: {type: string}
      remote_id: {type: string}
  - target: "$.components.schemas.Channel.properties"
    update:
      total_msg_count_root: {type: integer, format: int64}
      last_root_post_at: {type: integer, format: int64}
      group_constrained: {type: boolean}
      shared: {type: boolean}
      scheme_id: {type: string}
      props: {type: object, additionalProperties: true}
  - target: "$.components.schemas.ChannelMember.properties"
    update:
      msg_count_root: {type: integer, format: int64}
      mention_count_root: {type: integer, format: int64}
      urgent_mention_count: {type: integer, format: int64}
      scheme_user: {type: boolean}
      scheme_admin: {type: boolean}
      scheme_guest: {type: boolean}
  - target: "$.components.schemas.Status.properties"
    update:
      dnd_end_time: {type: integer, format: int64, description: "Epoch seconds", x-unix-seconds: true}
      active_channel: {type: string}
  # --- shapes the Dart generator cannot express ---
  - target: "$.paths['/api/v4/custom_profile_attributes/fields'].post.requestBody.content['application/json'].schema.properties.attrs.properties.access_mode"
    update: {enum: [source_only, shared_only]}
  - target: "$.paths['/api/v4/custom_profile_attributes/fields'].post.requestBody.content['application/json'].schema.properties.attrs.properties.access_mode.default"
    remove: true
  - target: "$.paths['/api/v4/custom_profile_attributes/fields/{field_id}'].patch.requestBody.content['application/json'].schema.properties.attrs.properties.access_mode"
    update: {enum: [source_only, shared_only]}
  - target: "$.paths['/api/v4/custom_profile_attributes/fields/{field_id}'].patch.requestBody.content['application/json'].schema.properties.attrs.properties.access_mode.default"
    remove: true
  - target: "$.paths['/api/v4/channels/{channel_id}/members'].put.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/channels/{channel_id}/members'].put.responses['200']"
    update:
      content:
        application/x-ndjson:
          schema: {type: string}
  # --- more fields the server sends (drift report) ---
  - target: "$.components.schemas.FileInfo.properties"
    update:
      mini_preview: {type: string, format: byte, description: "16x16 JPEG, base64"}
      archived: {type: boolean}
      channel_id: {type: string}
      remote_id: {type: string}
  - target: "$.components.schemas.Reaction.properties"
    update:
      channel_id: {type: string}
      update_at: {type: integer, format: int64}
      delete_at: {type: integer, format: int64}
      remote_id: {type: string}
  - target: "$.components.schemas.TeamMember.properties"
    update:
      scheme_guest: {type: boolean}
  - target: "$.components.schemas.Team.properties"
    update:
      last_team_icon_update: {type: integer, format: int64}
  - target: "$.components.schemas.SidebarCategoryWithChannels.properties"
    update:
      sorting: {type: string}
      muted: {type: boolean}
      collapsed: {type: boolean}
      sort_order: {type: integer}
  # --- entry sync and channel list (M2) ---
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].get.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].get.responses['200']"
    update:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/OrderedSidebarCategories"}
  - target: "$.paths['/api/v4/users/{user_id}/teams/unread'].get.parameters[?(@.name == 'exclude_team')].required"
    remove: true
  - target: "$.components.schemas.TeamUnread.properties"
    update:
      msg_count_root: {type: integer, format: int64}
      mention_count_root: {type: integer, format: int64}
      thread_count: {type: integer, format: int64}
      thread_mention_count: {type: integer, format: int64}
      thread_urgent_mention_count: {type: integer, format: int64}
  - target: "$.components.schemas.UserThread.properties"
    update:
      unread_replies: {type: integer, format: int64}
      unread_mentions: {type: integer, format: int64}
      is_urgent: {type: boolean}
      delete_at: {type: integer, format: int64}
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/threads'].get.parameters"
    update:
      - {name: unread, in: query, description: "Only threads with unread replies", schema: {type: boolean, default: false}}
  - target: "$.paths['/api/v4/channels/{channel_id}/posts'].get.parameters"
    update:
      - {name: collapsedThreads, in: query, description: "Leave replies out when collapsed reply threads are on", schema: {type: boolean, default: false}}
      - {name: collapsedThreadsExtended, in: query, description: "Include thread participants with collapsed reply threads", schema: {type: boolean, default: false}}
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].put.requestBody.content"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].put.requestBody"
    update:
      content:
        application/json:
          schema: {type: array, items: {$ref: "#/components/schemas/SidebarCategoryWithChannels"}}
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].put.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/teams/{team_id}/channels/categories'].put.responses['200']"
    update:
      content:
        application/json:
          schema: {type: array, items: {$ref: "#/components/schemas/SidebarCategoryWithChannels"}}
  # --- Home inbox (M2) ---
  - target: "$.paths['/api/v4/users/{user_id}/posts/flagged'].get.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/users/{user_id}/posts/flagged'].get.responses['200']"
    update:
      content:
        application/json:
          schema: {$ref: "#/components/schemas/PostList"}
  # --- search (M5): the server reads the file search body as JSON ---
  - target: "$.paths['/api/v4/teams/{team_id}/files/search'].post.requestBody.content"
    remove: true
  - target: "$.paths['/api/v4/teams/{team_id}/files/search'].post.requestBody"
    update:
      content:
        application/json:
          schema:
            type: object
            required: [terms, is_or_search]
            properties:
              terms: {type: string}
              is_or_search: {type: boolean}
              time_zone_offset: {type: integer, default: 0}
              include_deleted_channels: {type: boolean}
              page: {type: integer, default: 0}
              per_page: {type: integer, default: 60}
  # --- channel management (M5): fields the server sends and accepts (model/channel_member.go, channel_stats.go) ---
  - target: "$.components.schemas.ChannelNotifyProps.properties"
    update:
      ignore_channel_mentions: {type: string}
      desktop_threads: {type: string}
      push_threads: {type: string}
      email_threads: {type: string}
      channel_auto_follow_threads: {type: string}
  - target: "$.components.schemas.ChannelStats.properties"
    update:
      guest_count: {type: integer, format: int64}
      pinnedpost_count: {type: integer, format: int64}
      files_count: {type: integer, format: int64}
  # --- composer and writing (M4), checked against server/public/model and api4 ---
  - target: "$.paths['/api/v4/posts'].post.requestBody.content['application/json'].schema.properties.metadata.properties.priority"
    remove: true
  - target: "$.paths['/api/v4/posts'].post.requestBody.content['application/json'].schema.properties.metadata.properties"
    update:
      priority: {$ref: "#/components/schemas/PostPriority"}
  - target: "$.paths['/api/v4/posts'].post.requestBody.content['application/json'].schema.properties"
    update:
      pending_post_id: {type: string, description: "Client id that the created post and its posted event echo back"}
  - target: "$.paths['/api/v4/commands/execute'].post.requestBody.content['application/json'].schema.properties"
    update:
      team_id: {type: string}
      root_id: {type: string}
      parent_id: {type: string}
  - target: "$.components.schemas.CommandResponse.properties"
    remove: true
  - target: "$.components.schemas.CommandResponse"
    update:
      properties:
        response_type: {type: string, description: "in_channel or ephemeral"}
        text: {type: string}
        username: {type: string}
        channel_id: {type: string}
        icon_url: {type: string}
        type: {type: string}
        props: {type: object}
        goto_location: {type: string}
        trigger_id: {type: string}
        skip_slack_parsing: {type: boolean}
        attachments: {type: array, items: {$ref: "#/components/schemas/MessageAttachment"}}
  - target: "$.paths['/api/v4/emoji/autocomplete'].get.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/emoji/autocomplete'].get.responses['200']"
    update:
      content:
        application/json:
          schema: {type: array, items: {$ref: "#/components/schemas/Emoji"}}
  - target: "$.paths['/api/v4/users/autocomplete'].get.parameters"
    remove: true
  - target: "$.paths['/api/v4/users/autocomplete'].get"
    update:
      parameters:
        - {name: in_team, in: query, description: Team ID, schema: {type: string}}
        - {name: in_channel, in: query, description: Channel ID, schema: {type: string}}
        - {name: name, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
  - target: "$.paths['/api/v4/teams/{team_id}/commands/autocomplete_suggestions'].get.parameters"
    update:
      - {name: channel_id, in: query, schema: {type: string}}
      - {name: root_id, in: query, schema: {type: string}}
  - target: "$.paths['/api/v4/users/{user_id}/posts/{post_id}/set_unread'].post"
    update:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                collapsed_threads_supported: {type: boolean}
  - target: "$.paths['/api/v4/actions/dialogs/submit'].post.responses['200'].content"
    remove: true
  - target: "$.paths['/api/v4/actions/dialogs/submit'].post.responses['200']"
    update:
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
              errors: {type: object, additionalProperties: {type: string}}
  # --- presence (M5): the DND end is in seconds (app/status.go SetStatusDoNotDisturbTimed) ---
  - target: "$.paths['/api/v4/users/{user_id}/status'].put.requestBody.content['application/json'].schema.properties.dnd_end_time"
    update: {x-unix-seconds: true}
  # --- channel management (M5): with user_ids present (even empty) the server answers a list, not the member ---
  - target: "$.paths['/api/v4/channels/{channel_id}/members'].post.requestBody.content['application/json'].schema.properties.user_ids"
    remove: true
