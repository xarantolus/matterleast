name: Build for Android

on:
  # Push only: a pull request from a branch in this repo fires both events.
  push:
  workflow_dispatch:

# A cancelled release run is safe: the next run on main still finds the
# version untagged and releases it.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# The release step creates a tag and a release.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and history, for the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # The inputs of R8 and lint, the slowest Gradle tasks, rarely change
      # between commits.
      - name: Enable the Gradle build cache
        run: mkdir -p ~/.gradle && echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.sha }}
          restore-keys: gradle-build-cache-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # Gradle installs the NDK Flutter pins when the runner image lacks it.
      - name: Find the NDK version
        run: |
          version=$(grep -oP "ndkVersion = '\K[^']+" "$FLUTTER_ROOT/packages/flutter_tools/lib/src/android/gradle_utils.dart")
          echo "NDK_VERSION=$version" >> $GITHUB_ENV
          echo "NDK_DIR=$ANDROID_HOME/ndk/$version" >> $GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_VERSION }}

      - run: flutter pub get

      # Compiling the build script takes half of the build_runner run; it
      # recompiles by itself when its inputs differ.
      - uses: actions/cache@v6
        with:
          path: .dart_tool/build/entrypoint
          key: build-runner-${{ hashFiles('pubspec.lock') }}
          restore-keys: build-runner-

      - name: Check that generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code --stat

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

      # The analyzer plugins (riverpod_lint) only run through dart analyze.
      - run: dart analyze

      - run: flutter test

      - name: Extract env variables
        run: |
          # "version: 1.2.3+4" -> 1.2.3
          echo "APP_VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)" >> $GITHUB_ENV
          # Artifact names cannot contain a slash, branch names can.
          echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Set up signing config
        env:
          SIGNING_KEYSTORE_CONTENT: ${{ secrets.SIGNING_KEYSTORE_CONTENT }}
          SIGNING_PROPERTIES_CONTENT: ${{ secrets.SIGNING_PROPERTIES_CONTENT }}
        run: |
          echo "$SIGNING_KEYSTORE_CONTENT" | base64 -d - > upload-keystore.jks
          echo "X_KEYSTORE_PATH=$(pwd)/upload-keystore.jks" >> $GITHUB_ENV
          echo "$SIGNING_PROPERTIES_CONTENT" > android/key.properties

      - name: Build signed APK
        run: flutter build apk --release
        env:
          X_KEYSTORE_PATH: ${{ env.X_KEYSTORE_PATH }}

      - name: Show APK hashes
        run: find build/app/outputs -type f -name "*.apk" | xargs -L1 sha256sum

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: matterleast-apk-${{ env.APP_VERSION }}-${{ env.SAFE_REF }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # A version on main without its tag yet is a new release.
      - name: Write release notes
        id: notes
        if: github.ref == 'refs/heads/main'
        run: |
          if git rev-parse -q --verify "refs/tags/v$APP_VERSION" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --no-merges --format='- %s' ${previous:+"$previous"..HEAD} > release-notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Upload release
        if: steps.notes.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/*-release.apk
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.APP_VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
