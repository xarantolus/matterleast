name: Build

on:
  push:
  # Pull requests from forks; a branch in this repo is already checked on
  # push.
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build for Windows and Linux, without releasing
        type: boolean
        default: false

# A cancelled release run is safe: the next run on main still finds the
# version untagged and releases it.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Jobs ask for more themselves; only the publish job can write.
permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags, to tell whether this version was released already.
          fetch-depth: 0
          persist-credentials: false

      # A release is a version on main without its tag yet; every other run
      # stops after the checks.
      - name: Decide whether this run releases
        id: release
        run: |
          # "version: 1.2.3+4" -> 1.2.3
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_REF" != refs/heads/main ] \
              || git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # The native build hooks (PDFium, SQLite) download and compile
      # libraries; they rerun by themselves when their inputs differ.
      - name: Restore the native build hook outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/hooks_runner
          key: build-hooks-${{ hashFiles('pubspec.lock') }}
          restore-keys: build-hooks-

      - name: Get packages
        run: flutter pub get

      # build_runner compares every output with its sources and rewrites any
      # that differ, so an older cache only saves work and never hides a
      # stale generated file.
      - name: Restore the build_runner cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/build
          key: build-runner-${{ hashFiles('pubspec.lock', 'build.yaml') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ hashFiles('pubspec.lock', 'build.yaml') }}-
            build-runner-

      - name: Check that generated code is current
        run: |
          dart run build_runner build
          git add --intent-to-add .
          git diff --exit-code --stat

      - name: Check that generated code has no documentation comments
        # The upstream API docs are CC BY-NC-SA; tool/update-api.sh strips them.
        run: "! grep -rn '^[[:space:]]*///' lib/api/generated"

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Entries are keyed by content, so an older cache is safe to reuse.
      - name: Restore the analyzer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dartServer
          key: dart-analyzer-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: dart-analyzer-${{ hashFiles('pubspec.lock') }}-

      - name: Analyze with flutter analyze
        run: flutter analyze

      # The analyzer plugins (riverpod_lint) only run through dart analyze.
      - name: Analyze with dart analyze
        run: dart analyze

      # Tests build the native hooks for this host, and the tray plugin's
      # (nativeapi) compiles against GTK, X11 and Xi.
      - name: Install the desktop build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libx11-dev libxi-dev

      - name: Run tests
        run: flutter test
        env:
          # A zone with summer time, so date labels are tested across
          # clock changes.
          TZ: Europe/Berlin

  # The only job that sees the signing secrets. They live in the release
  # environment, which admits main alone, so no other branch, fork or pull
  # request can reach them. It only uploads the APK; publish releases it.
  android:
    name: Build for Android
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-26.04
    environment: release

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java and the Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # The inputs of R8 and lint, the slowest Gradle tasks, rarely change
      # between commits.
      - name: Enable the Gradle build cache
        run: mkdir -p ~/.gradle && echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Restore the Gradle build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.sha }}
          restore-keys: gradle-build-cache-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # Gradle installs the NDK Flutter pins when the runner image lacks it.
      - name: Find the NDK version
        run: |
          version=$(grep -oP "ndkVersion = '\K[^']+" "$FLUTTER_ROOT/packages/flutter_tools/lib/src/android/gradle_utils.dart")
          echo "NDK_VERSION=$version" >> $GITHUB_ENV
          echo "NDK_DIR=$ANDROID_HOME/ndk/$version" >> $GITHUB_ENV

      - name: Restore the NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NDK_DIR }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Restore the native build hook outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/hooks_runner
          key: build-hooks-${{ hashFiles('pubspec.lock') }}
          restore-keys: build-hooks-

      - name: Get packages
        run: flutter pub get

      - name: Set up signing
        env:
          SIGNING_KEYSTORE_CONTENT: ${{ secrets.SIGNING_KEYSTORE_CONTENT }}
          SIGNING_PROPERTIES_CONTENT: ${{ secrets.SIGNING_PROPERTIES_CONTENT }}
        run: |
          echo "$SIGNING_KEYSTORE_CONTENT" | base64 -d - > "$RUNNER_TEMP/upload-keystore.jks"
          echo "X_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> $GITHUB_ENV
          echo "$SIGNING_PROPERTIES_CONTENT" > android/key.properties

      - name: Build the release APK
        # Releases are for phones; emulators run local debug builds.
        run: >-
          flutter build apk --release --target-platform android-arm,android-arm64
          --dart-define=RELEASE_REPO=$GITHUB_REPOSITORY

      # One stable name, so the README can link to the latest release's
      # download directly.
      - name: Name the APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/matterleast.apk"
          sha256sum "$RUNNER_TEMP/matterleast.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: ${{ runner.temp }}/matterleast.apk
          if-no-files-found: error
          retention-days: 30

  # Desktop builds run only for releases and on request (the desktop input
  # of a manual run): Windows minutes are costly. They get no secrets.
  windows:
    name: Build for Windows
    needs: check
    if: needs.check.outputs.release == 'true' || inputs.desktop
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Get packages
        run: flutter pub get

      # The update check asks this repository, so a fork checks its own.
      - name: Build for Windows
        run: flutter build windows --release "--dart-define=RELEASE_REPO=$env:GITHUB_REPOSITORY"

      # Inno Setup comes with the runner image; installed if an image
      # drops it.
      - name: Build the installer
        env:
          APP_VERSION: ${{ needs.check.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/O$env:RUNNER_TEMP" windows\installer\matterleast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "$env:RUNNER_TEMP\matterleast-setup.exe"

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: ${{ runner.temp }}/matterleast-setup.exe
          if-no-files-found: error
          retention-days: 30

  # Experimental: the runner's bundle as a tarball.
  linux:
    name: Build for Linux
    needs: check
    if: needs.check.outputs.release == 'true' || inputs.desktop
    runs-on: ubuntu-26.04

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The libraries of the dev container's desktop layer, and X11 and Xi
      # for the tray plugin.
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libx11-dev libxi-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Restore the native build hook outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .dart_tool/hooks_runner
          key: build-hooks-${{ hashFiles('pubspec.lock') }}
          restore-keys: build-hooks-

      - name: Get packages
        run: flutter pub get

      - name: Build for Linux
        run: flutter build linux --release --dart-define=RELEASE_REPO=$GITHUB_REPOSITORY

      - name: Pack the bundle
        run: |
          tool/pack-linux.sh "$RUNNER_TEMP"

      - name: Upload the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: ${{ runner.temp }}/matterleast-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # The only job that can write to the repository. Without always() it
  # runs only when every build succeeded, so a release has all its files.
  publish:
    name: Publish the release
    needs: [check, android, windows, linux]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      # Creates the tag and the release.
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and history, for the release notes.
          fetch-depth: 0
          persist-credentials: false

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --no-merges --format='- %s' ${previous:+"$previous"..HEAD} > "$RUNNER_TEMP/release-notes.md"

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: List the files
        run: sha256sum "$RUNNER_TEMP"/dist/*

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            ${{ runner.temp }}/dist/matterleast.apk
            ${{ runner.temp }}/dist/matterleast-setup.exe
            ${{ runner.temp }}/dist/matterleast-linux-x64.tar.gz
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds the F-Droid repository at once instead of at its nightly
      # run. FDROID_REPO_TOKEN is a fine-grained token scoped to
      # xarantolus/fdroid alone, with Contents: write (what dispatches need).
      - name: Tell the F-Droid repository about the release
        env:
          GH_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: gh api repos/xarantolus/fdroid/dispatches -f event_type=app-released
