name: matterleast
description: A Mattermost client.
publish_to: 'none'
version: 0.9.0+15

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  background_downloader: ^9.6.4
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  extended_image: ^10.1.0
  file: ^7.0.1
  file_picker: ^13.2.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_local_notifications: ^22.3.3
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  # 4.x opens a plain Custom Tab. 5.x uses Chrome's Auth Tab, which crashed
  # ("Aw, Snap") on the mmauth:// redirect with Chrome 141 on a real phone.
  flutter_web_auth_2: ^4.1.0
  freezed_annotation: ^3.1.0
  image: ^4.12.0
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  json_annotation: ^4.12.0
  markdown: ^7.3.1
  material_color_utilities: ^0.13.0
  material_ui: ^1.8.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.10.1
  quick_actions: ^1.1.1
  re_highlight: 0.0.3
  receive_sharing_intent: ^1.9.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  sqlite3: ^3.8.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.2
  swagger_parser: ^1.45.0
  yaml: ^3.1.4
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/legacy.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
