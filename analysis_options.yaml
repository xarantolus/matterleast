include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - tmp/**
    - lib/api/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - windows/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
