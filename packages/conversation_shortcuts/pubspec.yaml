name: conversation_shortcuts
description: Conversation shortcuts for Android notifications and Direct Share, and iOS share-sheet suggestions.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.7
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.github.xarantolus.conversation_shortcuts
        pluginClass: ConversationShortcutsPlugin
      ios:
        pluginClass: ConversationShortcutsPlugin

dependencies:
  flutter:
    sdk: flutter
